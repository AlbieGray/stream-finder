name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: stream-finder
  AZURE_WEBAPP_PACKAGE_PATH: 'backend/wwwroot'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10'                 # set this to the .NET Core version to use

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:

      - uses: actions/checkout@v4
      - name: setup node frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
        run: npm ci
        run: npm run build --if-present
        working-directory: frontend

      - name: copy frontend to wwwroot
        run: mkdir backend/wwwroot
        run: cp -r frontend/dist/* backend/wwwroot/
      
      # - name: Download artifact from build job
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: .net-app
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build and publish backend
        run: dotnet publish --configuration Release --output publish
        working-directory: backend

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
